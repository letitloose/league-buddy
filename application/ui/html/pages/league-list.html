{{define "title"}}Leagues{{end}}

{{define "main"}}
<div class="flex flex-col items-center">
    <div class="text-center">
        <h2>Leagues</h2>
    </div>
    {{if .IsAdmin}}
    <div class="flex flex-col sm:flex-row sm:justify-center sm:flex-wrap items-stretch sm:items-center gap-2 w-full max-w-xs sm:max-w-none px-4 sm:px-0 mb-4">
        <a class="btn-secondary text-center m-0" href="/admin/league/create">Add League</a>
    </div>
    {{end}}
    <div class="overflow-x-auto w-full md:w-2/3 px-2 md:px-0">
    <table class="text-left w-full mb-4">
        <tr>
            <th>Name</th>
            {{if .IsAdmin}}<th>Actions</th>{{end}}
        </tr>
        {{range .Data}}
        <tr>
            <td><a href="/league/{{.ID}}">{{.Name}}</a></td>
            {{if $.IsAdmin}}
            <td>
                <a href="/admin/league/update/{{.ID}}">Edit</a>
                <button class="text-red-600" data-delete-url="/admin/league/delete/{{.ID}}" data-confirm-message="Delete league {{.Name}}?" data-conflict-message="{{.Name}} still has teams in it. Remove them first, then delete the league." data-redirect-url="/league">Delete</button>
            </td>
            {{end}}
        </tr>
        {{end}}
    </table>
    </div>
</div>
{{end}}
