{{define "title"}}Add Season{{end}}

{{define "main"}}
<div class="flex items-center flex-col">
    <h2>Add Season</h2>
    <div class="w-full max-w-xs">
        <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4" action='/admin/season/create' method='POST'>
            <input type='hidden' name='csrf_token' value='{{.CSRFToken}}'>
            {{template "season-league-field" .}}
            {{template "season-form-fields" .}}
            <div class="flex justify-between">
                <input class="btn m-0" type='submit' value='Add'>
                <a class="btn m-0" href="/league">Cancel</a>
            </div>
        </form>
    </div>
</div>
{{end}}
