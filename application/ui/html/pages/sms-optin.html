{{define "title"}}SMS Opt-In{{end}}

{{define "main"}}
<div class="flex flex-col items-center">
    <div class="w-full max-w-2xl px-2 md:px-0">
        <h2 class="text-center">SMS Opt-In</h2>
        <p class="text-sm text-gray-500 text-center mb-6">Screenshots of the real phone-verification and reminder-delivery opt-in flow on a player's Notification Preferences page.</p>

        <div class="bg-white shadow-md rounded px-6 py-6 mb-4">
            <h3 class="pt-0 text-center">Phone number entry and SMS consent</h3>
            <img src="/static/images/sms-optin-1.png" alt="Phone number entry and SMS consent checkbox on the Notification Preferences page">
        </div>

        <div class="bg-white shadow-md rounded px-6 py-6 mb-4">
            <h3 class="pt-0 text-center">Verification code confirmation</h3>
            <img src="/static/images/sms-optin-2.png" alt="Verification code confirmation on the Notification Preferences page">
        </div>

        <div class="bg-white shadow-md rounded px-6 py-6 mb-4">
            <h3 class="pt-0 text-center">Reminder delivery preferences</h3>
            <img src="/static/images/sms-optin-3.png" alt="Reminder delivery preferences on the Notification Preferences page">
        </div>
    </div>
</div>
{{end}}
