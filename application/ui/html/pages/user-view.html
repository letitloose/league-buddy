{{define "title"}}User #{{.Data.UserID}}{{end}}

{{define "main"}}
{{with .Data}}
<h2 class="text-center">User Profile</h2>
<div class="flex flex-col md:flex-row md:justify-evenly mb-4 gap-4 px-2 md:px-0">
    <div class="w-full md:w-5/12 bg-white shadow-md px-3 py-4 rounded text-center">
        <div class="flex">
            <div class="mr-2 text-right w-1/3 font-semibold">Email:</div>
            <p><a href="mailto:{{.Email}}">{{.Email}}</a></p>
        </div>
        {{if .PlayerID.Valid}}
        <div class="flex">
            <div class="mr-2 text-right w-1/3 font-semibold">Player Profile:</div>
            <p><a href="/player/view/{{.PlayerID.Int32}}">{{.PlayerName.String}}</a></p>
        </div>
        {{end}}
        <div class="flex">
            <div class="mr-2 text-right w-1/3 font-semibold">Sign-up Date:</div>
            <p>{{humanDate .Created}}</p>
        </div>
        <div class="flex justify-center items-center gap-4 mt-2">
            <label class="field-label">Active
                <input type="checkbox" class="ml-1" value="{{.Active}}" data-toggle-url="/user/toggleActive" data-user-id="{{.UserID}}">
            </label>
            <label class="field-label">Admin
                <input type="checkbox" class="ml-1" value="{{.IsAdmin}}" data-toggle-url="/user/toggleAdmin" data-user-id="{{.UserID}}">
            </label>
        </div>
        <div class="mt-4">
            <button class="btn bg-red-600 hover:bg-red-700" data-delete-url="/user/delete/{{.UserID}}" data-confirm-message="Delete user {{.Email}}?" data-redirect-url="/user/search">Delete User</button>
        </div>
    </div>
</div>
{{end}}
{{end}}
