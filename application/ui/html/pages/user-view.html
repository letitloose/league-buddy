{{define "title"}}User #{{.Data.UserID}}{{end}}

{{define "main"}}
{{with .Data}}
<div class="flex flex-col items-center">
<h2 class="text-center">User Profile</h2>
<div class="w-full sm:max-w-md mx-auto px-2 sm:px-0 mb-4">
    <div class="bg-white border border-brand-line px-4 py-4 text-center">
        <div class="inline-grid grid-cols-[auto_auto] gap-x-2 gap-y-1 text-left">
            <span class="text-right font-semibold">Email:</span>
            <span><a href="mailto:{{.Email}}">{{.Email}}</a></span>
            {{if .PlayerID.Valid}}
            <span class="text-right font-semibold">Player Profile:</span>
            <span><a href="/player/view/{{.PlayerID.Int32}}">{{.PlayerName.String}}</a></span>
            {{end}}
            <span class="text-right font-semibold">Sign-up Date:</span>
            <span>{{humanDate .Created}}</span>
        </div>
        <div class="flex justify-center items-center gap-4 mt-4">
            <label class="field-label">Active
                <input type="checkbox" class="ml-1" value="{{.Active}}" data-toggle-url="/user/toggleActive" data-user-id="{{.UserID}}">
            </label>
            <label class="field-label">Admin
                <input type="checkbox" class="ml-1" value="{{.IsAdmin}}" data-toggle-url="/user/toggleAdmin" data-user-id="{{.UserID}}">
            </label>
        </div>
        <div class="mt-4">
            <button class="btn-secondary text-red-600 m-0" data-delete-url="/user/delete/{{.UserID}}" data-confirm-message="Delete user {{.Email}}?" data-redirect-url="/user/search">Delete User</button>
        </div>
    </div>
</div>
</div>
{{end}}
{{end}}
