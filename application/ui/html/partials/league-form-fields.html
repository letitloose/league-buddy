{{define "league-form-fields"}}
    {{range .Form.NonFieldErrors}}
        <p class="error-message pb-2">{{.}}</p>
    {{end}}
    <div class="mb-4">
        <label class="field-label">Name</label>
        {{$errorClass := ""}}
        {{if .Form.FieldErrors.name }}
            {{$errorClass = "error-border"}}
        {{end}}
        <input class="form-field {{$errorClass}}" type='text' name='name' value='{{.Form.Name}}'>
        {{with .Form.FieldErrors.name}}
            <p class='error-message'>{{.}}</p>
        {{end}}
    </div>
    <div class="mb-4">
        <label class="field-label">Motto</label>
        <input class="form-field" type='text' name='motto' value='{{.Form.Motto}}'>
    </div>
    <div class="mb-4">
        <label class="field-label">Established</label>
        <input class="form-field" type='date' name='establisheddate' value='{{.Form.EstablishedDate}}'>
    </div>
{{end}}
